name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly rebuild: refreshes the Debian packages installed on top of the (digest-pinned) base
    # image, e.g. Chromium's system libraries.
    - cron: "0 4 * * 2"
  workflow_dispatch: # also used by the release-dependabot job below

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: tpch-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests (offline, fixtures)
        run: docker run --rm tpch-mcp:ci pytest -q

      - name: MCP smoke test (stdio, no network)
        run: docker run --rm tpch-mcp:ci python tests/smoke_mcp.py

      # Live tests against toppreise.ch are deliberately not run in CI.

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/tpch-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Dependabot PR passed the build + tests above: merge it and publish a new image.
  # A merge done with GITHUB_TOKEN does not trigger the push workflow (GitHub prevents
  # recursive runs), but workflow_dispatch is allowed, so the release run is started explicitly.
  release-dependabot:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge the Dependabot PR
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image from main
        run: gh workflow run docker.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
