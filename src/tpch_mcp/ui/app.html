<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No Referer on images and the library download (see README: MCP Apps). -->
<meta name="referrer" content="no-referrer">
<title>tpch</title>
<script type="importmap">
{
  "imports": {
    "ext-apps": "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@2.0.4/dist/src/app-with-deps.js"
  },
  "integrity": {
    "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@2.0.4/dist/src/app-with-deps.js": "sha384-BcYSOlnbm0uMq2/ZWLkwX+z8gt95koY6ne5g0MbXXA4P65fJUagNbjh94Yx+CuKH"
  }
}
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, light-dark(#ffffff, #1f1f1e));
    --bg2: var(--color-background-secondary, light-dark(#f5f4ef, #2a2a28));
    --fg: var(--color-text-primary, light-dark(#1f1e1d, #f0eee6));
    --fg2: var(--color-text-secondary, light-dark(#6b6a66, #b5b3ad));
    --line: var(--color-border-primary, light-dark(#e5e3dc, #3a3936));
    --ok: var(--color-text-success, light-dark(#1e7b45, #5fc58a));
    --warn: var(--color-text-warning, light-dark(#a35c00, #e8a54b));
    --bad: var(--color-text-danger, light-dark(#b42318, #f07167));
    --accent: var(--color-text-info, light-dark(#c2410c, #f2a57a));
    --radius: var(--border-radius-lg, 12px);
    --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--fg); font: 14px/1.4 var(--font); }
  #app { padding: 4px 2px 8px; }
  h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  .muted { color: var(--fg2); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .chip { background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .warn { color: var(--warn); font-size: 12px; margin: 4px 0; }
  .carousel { display: grid; grid-auto-flow: column; grid-auto-columns: 190px; gap: 10px; overflow-x: auto;
              scroll-snap-type: x mandatory; padding: 6px 2px 10px; }
  .card { scroll-snap-align: start; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 290px; }
  .card .img { height: 120px; display: flex; align-items: center; justify-content: center; background: #fff;
               border-radius: 8px; overflow: hidden; position: relative; }
  .card .img img { max-width: 100%; max-height: 120px; object-fit: contain; }
  .card .noimg { color: #9a978f; font-size: 12px; }
  .badge { position: absolute; top: 6px; left: 6px; background: var(--fg); color: var(--bg); border-radius: 6px;
           font-size: 11px; font-weight: 700; padding: 1px 6px; }
  .badge.drop { background: var(--ok); color: #fff; }
  .name { font-size: 13px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
          overflow: hidden; min-height: 54px; }
  .price { font-size: 17px; font-weight: 700; }
  .meta { font-size: 12px; color: var(--fg2); }
  .actions { margin-top: auto; display: flex; gap: 4px; flex-wrap: wrap; }
  button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--fg);
           border-radius: 8px; padding: 3px 8px; cursor: pointer; }
  button:hover { border-color: var(--fg2); }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--fg2); font-weight: 500; }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.best td { font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .panel { margin-top: 10px; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; background: var(--bg); }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 8px 0; }
  .stat { background: var(--bg2); border-radius: 8px; padding: 6px 8px; }
  .stat b { display: block; font-size: 15px; }
  .up { color: var(--bad); } .down { color: var(--ok); }
  svg.chart { width: 100%; height: 180px; display: block; }
  .product { display: grid; grid-template-columns: 140px 1fr; gap: 12px; align-items: start; }
  .product .img { height: 140px; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 8px; }
  .product .img img { max-width: 100%; max-height: 140px; object-fit: contain; }
  .specs { columns: 2 220px; font-size: 12px; margin-top: 8px; }
  .specs div { break-inside: avoid; margin-bottom: 2px; }
  .specs span { color: var(--fg2); }
  .loading { color: var(--fg2); padding: 16px 4px; }
  .error { color: var(--bad); }
  .scroll { overflow-x: auto; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading toppreise.ch …</div></div>
<script type="module">
import { App, PostMessageTransport, applyDocumentTheme, applyHostStyleVariables, applyHostFonts } from "ext-apps";

const root = document.getElementById("app");
const app = new App({ name: "tpch", version: "1.0.0" }, {}, { autoResize: true });

// ------------------------------------------------------------------ helpers
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const chf = (v) => v == null ? "–" : "CHF " + Number(v).toLocaleString("de-CH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const unwrap = (r) => {
  let d = r && (r.structuredContent ?? null);
  if (!d && r && r.content) { try { d = JSON.parse(r.content.find((c) => c.type === "text")?.text ?? "null"); } catch { d = null; } }
  return d && d.result && typeof d.result === "object" && Object.keys(d).length === 1 ? d.result : d;
};
const errorText = (r) => r?.content?.find((c) => c.type === "text")?.text ?? "Error";
const open = (url) => url && app.openLink({ url });
const img = (src, alt) => src
  ? h("img", { src, alt: alt || "", loading: "lazy", referrerpolicy: "no-referrer" })
  : h("span", { class: "noimg" }, "no image");
const availColor = (lvl) => ({ 1: "var(--ok)", 2: "var(--warn)", 3: "var(--warn)", 4: "var(--warn)" })[lvl] || "var(--fg2)";
const AVAIL = { "in stock": 1, "available from external/foreign warehouse": 2, "up to one week": 3, "up to two weeks": 4 };

let detail = null;  // panel under the carousel for offers / history fetched from the app

async function showDetail(title, tool, args, renderFn) {
  if (!detail) return;
  detail.replaceChildren(h("div", { class: "panel" }, h("div", { class: "loading" }, `Loading ${title} …`)));
  try {
    const r = await app.callServerTool({ name: tool, arguments: args });
    if (r.isError) throw new Error(errorText(r));
    detail.replaceChildren(h("div", { class: "panel" },
      h("div", { class: "panel-head" }, h("h2", {}, title), h("button", { onclick: () => detail.replaceChildren() }, "Close")),
      renderFn(unwrap(r))));
  } catch (e) {
    detail.replaceChildren(h("div", { class: "panel error" }, String(e.message || e)));
  }
}

function productButtons(p, withOffers = true) {
  return h("div", { class: "actions" },
    withOffers && h("button", { class: "primary", onclick: () => showDetail(`Offers – ${p.name}`, "get_offers", { product_id: p.id, limit: 15 }, renderOffers) }, "Offers"),
    h("button", { onclick: () => showDetail(`Price history – ${p.name}`, "get_price_history", { product_id: p.id, days: 365 }, renderHistory) }, "History"),
    h("button", { onclick: () => open(p.url) }, "Open"));
}

// ------------------------------------------------------------------ views
function card(p, badge, badgeClass = "") {
  const avail = p.availability ? h("span", {}, h("span", { class: "dot", style: `background:${availColor(AVAIL[p.availability])}` }), p.availability) : null;
  return h("div", { class: "card" },
    h("div", { class: "img" }, img(p.image, p.name), badge && h("span", { class: `badge ${badgeClass}` }, badge)),
    h("div", { class: "name", title: p.name }, p.name),
    h("div", { class: "price" }, chf(p.price_incl_shipping ?? p.price)),
    h("div", { class: "meta" }, [
      p.offer_count != null ? `${p.offer_count} offers` : null,
      p.rating ? `★ ${p.rating}${p.ratings_count ? ` (${p.ratings_count})` : ""}` : null,
      p.price_per_unit ? `${chf(p.price_per_unit.price)}/${p.price_per_unit.unit}` : null,
    ].filter(Boolean).join(" · ")),
    avail && h("div", { class: "meta" }, avail),
    productButtons(p));
}

function renderList(d) {
  const items = [];
  for (const it of d.items || []) {
    if (it.type === "series") {
      for (const v of it.variants || []) items.push({ ...v, image: v.image || it.image });
    } else if (it.type === "offer") {
      continue;  // raw shop offers: shown by the model as text
    } else items.push(it);
  }
  const title = d.title ? `${d.title}${d.category ? " – " + d.category.name : ""}`
                        : (d.category ? d.category.name : "Results") + (d.query ? ` – “${d.query}”` : "");
  const sub = [d.matches != null ? `${Number(d.matches).toLocaleString("de-CH")} products` : null,
               d.pages > 1 ? `page ${d.page} / ${d.pages}` : null,
               d.period_hours ? `price drops in the last ${d.period_hours} h` : null].filter(Boolean).join(" · ");
  detail = h("div");
  return h("div", {},
    h("h2", {}, title), sub && h("div", { class: "muted" }, sub),
    (d.applied || []).length ? h("div", { class: "chips" }, d.applied.map((a) => h("span", { class: "chip" }, a))) : null,
    ...(d.warnings || []).map((w) => h("div", { class: "warn" }, w)),
    d.note ? h("div", { class: "muted" }, d.note) : null,
    items.length ? h("div", { class: "carousel" }, items.map((p) => {
      if (p.price_change_pct != null) return card(p, `${p.price_change_pct}%`, "drop");
      if (p.rank && (d.list === "top100" || d.list === "new_products")) return card(p, `#${p.rank}`);
      return card(p, null);
    })) : h("div", { class: "muted" }, "No products."),
    detail);
}

function renderOffers(d) {
  const offers = d.offers || [];
  const best = Math.min(...offers.map((o) => o.total ?? Infinity));
  return h("div", {},
    h("div", { class: "muted" }, `${d.shown} of ${d.offer_count} offers · sorted by total incl. shipping · shop ratings out of 6`),
    d.warning ? h("div", { class: "warn" }, d.warning) : null,
    h("div", { class: "scroll" }, h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, "Shop"), h("th", {}, "Availability"), h("th", { class: "num" }, "Rating"),
        h("th", { class: "num" }, "Shipping"), h("th", { class: "num" }, "Total"), h("th", {}, ""))),
      h("tbody", {}, offers.map((o) => h("tr", { class: o.total === best ? "best" : "" },
        h("td", {}, o.shop || "?"),
        h("td", {}, h("span", { class: "dot", style: `background:${availColor(o.availability?.level)}` }), o.availability?.text || "–"),
        h("td", { class: "num" }, o.shop_rating ? `★ ${o.shop_rating}` : "–"),
        h("td", { class: "num" }, o.shipping ? chf(o.shipping) : "free"),
        h("td", { class: "num" }, chf(o.total)),
        h("td", {}, h("button", { onclick: () => open(o.url), title: "Open this offer on the shop's site" }, "Shop")))))))
  );
}

function renderHistory(d, standalone = false) {
  if (!d.series || !d.series.length) return h("div", { class: "muted" }, d.note || "No price history.");
  const pts = d.series, W = 600, H = 180, P = 14, L = 92;  // L: left gutter for the price labels
  const ys = pts.map((p) => p.price), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const x = (i) => L + (i * (W - L - P)) / Math.max(1, pts.length - 1);
  const y = (v) => H - P - ((v - lo) * (H - 2 * P)) / span;
  const svgNS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs) => { const e = document.createElementNS(svgNS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
  const svg = s("svg", { class: "chart", viewBox: `0 0 ${W} ${H}` });
  svg.append(s("polyline", { points: pts.map((p, i) => `${x(i)},${y(p.price)}`).join(" "), fill: "none", stroke: "currentColor", "stroke-width": "2", "vector-effect": "non-scaling-stroke" }));
  const iLow = ys.indexOf(lo);
  const dot = s("circle", { cx: x(iLow), cy: y(lo), r: "4", fill: "var(--ok)" });
  const t = s("title", {}); t.textContent = `lowest ${chf(lo)} on ${pts[iLow].date}`; dot.append(t);
  svg.append(dot);
  for (const [v, label] of [[hi, chf(hi)], [lo, chf(lo)]]) {
    const tx = s("text", { x: String(L - 8), y: String(y(v) + 4), "font-size": "11", "text-anchor": "end", fill: "currentColor", opacity: "0.7" }); tx.textContent = label; svg.append(tx);
    svg.append(s("line", { x1: String(L), x2: String(W - P), y1: String(y(v)), y2: String(y(v)), stroke: "currentColor", opacity: "0.15", "stroke-dasharray": "3 3" }));
  }
  const pct = (v) => v == null ? "–" : h("span", { class: v > 0 ? "up" : v < 0 ? "down" : "" }, `${v > 0 ? "+" : ""}${v}%`);
  return h("div", {},
    standalone ? h("h2", {}, "Price history") : null,
    h("div", { class: "muted" }, `${d.from} – ${d.to} · lowest price incl. shipping`),
    h("div", { class: "stats" },
      h("div", { class: "stat" }, "Now", h("b", {}, chf(d.current))),
      h("div", { class: "stat" }, "Lowest", h("b", {}, chf(d.lowest?.price)), h("span", { class: "muted" }, d.lowest?.date)),
      h("div", { class: "stat" }, "Highest", h("b", {}, chf(d.highest?.price))),
      h("div", { class: "stat" }, "Average", h("b", {}, chf(d.average))),
      h("div", { class: "stat" }, "7 / 30 / 90 days", h("b", {}, pct(d.change_pct?.["7d"]), " ", pct(d.change_pct?.["30d"]), " ", pct(d.change_pct?.["90d"])))),
    d.is_at_lowest ? h("div", { class: "warn", style: "color:var(--ok)" }, "At its lowest price in this period.") : null,
    h("div", { style: "color:var(--accent)" }, svg));
}

function renderProduct(d) {
  detail = h("div");
  const specs = Object.entries(d.specs || {}).flatMap(([g, rows]) => Object.entries(rows).map(([k, v]) => [k, v])).slice(0, 16);
  return h("div", {},
    h("div", { class: "product" },
      h("div", { class: "img" }, img(d.image, d.name)),
      h("div", {},
        h("h2", {}, d.name),
        h("div", { class: "muted" }, (d.category_path || []).join(" › ")),
        h("div", { class: "price", style: "margin-top:6px" }, `${chf(d.price?.min)} – ${chf(d.price?.max)}`),
        h("div", { class: "meta" }, `${d.price?.offer_count ?? "?"} offers`,
          d.best_offer ? ` · cheapest at ${d.best_offer.shop} (${chf(d.best_offer.total)} incl. shipping)` : ""),
        productButtons({ id: d.id, name: d.name, url: d.url }))),
    specs.length ? h("div", { class: "specs" }, specs.map(([k, v]) => h("div", {}, h("span", {}, k + ": "), v))) : null,
    detail);
}

function renderCompare(d) {
  const ps = d.products || [];
  const best = Math.min(...ps.map((p) => p.best_total ?? Infinity));
  const diffs = Object.entries(d.differences || {});
  const LIMIT = 15;
  const tbody = h("tbody", {});
  const fill = (n) => tbody.replaceChildren(
    h("tr", { class: "best" }, h("td", {}, "Best price"), ps.map((p) => h("td", { class: "num", style: p.best_total === best ? "color:var(--ok)" : "" }, chf(p.best_total)))),
    h("tr", {}, h("td", {}, "Offers"), ps.map((p) => h("td", { class: "num" }, p.offers ?? "–"))),
    ...diffs.slice(0, n).map(([k, vals]) => h("tr", {}, h("td", { class: "muted" }, k.split(" / ").pop()), vals.map((v) => h("td", {}, v ?? "–")))));
  fill(LIMIT);
  const more = diffs.length > LIMIT
    ? h("button", { onclick: (e) => { fill(diffs.length); e.target.remove(); } }, `Show all ${diffs.length} differences`)
    : null;
  return h("div", { class: "scroll" },
    h("h2", {}, "Comparison"),
    h("table", {},
      h("thead", {}, h("tr", {}, h("th", {}, ""), ps.map((p) => h("th", {}, h("a", { href: "#", onclick: (e) => { e.preventDefault(); open(p.url); } }, p.name))))),
      tbody),
    h("div", { style: "display:flex;gap:8px;align-items:center;margin-top:6px" }, more,
      d.identical_specs_omitted ? h("span", { class: "muted" }, `${d.identical_specs_omitted} identical specs not shown`) : null));
}

const VIEWS = {
  get_top_list: renderList, browse: renderList, search: renderList,
  get_product: renderProduct, get_offers: renderOffers, get_price_history: (d) => renderHistory(d, true), compare_products: renderCompare,
};

function guessView(d) {
  if (d.offers && d.product) return renderOffers;
  if (d.series && d.lowest) return (x) => renderHistory(x, true);
  if (d.differences) return renderCompare;
  if (d.specs && d.price) return renderProduct;
  return renderList;
}

function render(result) {
  if (result.isError) { root.replaceChildren(h("div", { class: "error" }, errorText(result))); return; }
  const d = unwrap(result);
  if (!d) { root.replaceChildren(h("div", { class: "muted" }, "No data.")); return; }
  const tool = app.getHostContext()?.toolInfo?.tool?.name;
  const view = VIEWS[tool] || guessView(d);
  try { root.replaceChildren(view(d)); }
  catch (e) { root.replaceChildren(h("div", { class: "error" }, "Could not display this result: " + e.message)); }
}

function applyContext(ctx) {
  if (!ctx) return;
  if (ctx.theme) applyDocumentTheme(ctx.theme);
  if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
  if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
}

app.ontoolinput = () => root.replaceChildren(h("div", { class: "loading" }, "Asking toppreise.ch …"));
app.ontoolresult = render;
app.ontoolcancelled = (p) => root.replaceChildren(h("div", { class: "muted" }, "Cancelled" + (p?.reason ? `: ${p.reason}` : "")));
app.onhostcontextchanged = applyContext;

await app.connect(new PostMessageTransport(window.parent, window.parent));
applyContext(app.getHostContext());
</script>
</body>
</html>
